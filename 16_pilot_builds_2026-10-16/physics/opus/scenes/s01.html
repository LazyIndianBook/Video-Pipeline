    heads.push({ el: g, words, start: words.length ? Math.min(...words.map(w => w.at)) : 0, last: words.length ? Math.max(...words.map(w => w.at)) : 0 });
  });
  heads.forEach((h, i) => { h.end = i + 1 < heads.length ? heads[i + 1].start : Infinity;
    const hold = Math.min(h.end, window.DURATION) - h.last;
    if (hold < HOLD_MIN) report('W_HOLD_SHORT', 'warning', 'headline ' + i + ' hold ' + hold.toFixed(2) + ' s < ' + HOLD_MIN + ' s [N60]'); });
}
function buildWordText(spec) {                       // think plate and disclosure: words from the sheet, never typed
  const host = document.getElementById(spec.element); if (!host) { report('W_CUE_NO_ELEMENT', 'warning', 'missing ' + spec.element); return null; }
  const B = BEATS[spec.beat]; if (!B) { report('E_TEXT_WORD_MISSING', 'error', 'beat ' + spec.beat + ' not in cue sheet'); return null; }
  const picked = spec.words ? spec.words.map(([w, o]) => wordAt(spec.beat, w, o)).filter(Boolean) : B.words;
  const lines = host.querySelectorAll('text.line'), parts = [];
  let li = 0, inLine = 0;
  picked.forEach(x => {
    if (spec.lines && inLine >= spec.lines[li] && li + 1 < lines.length) { li++; inLine = 0; }
    const ts = document.createElementNS(NS, 'tspan');
    ts.textContent = (inLine ? ' ' : '') + (spec.caps ? x.w.charAt(0).toUpperCase() + x.w.slice(1) : x.w) + (spec.stop ? '.' : '');
    lines[li].appendChild(ts); parts.push({ el: ts, at: Math.max(0, x.t0 - LEAD) }); inLine++;
  });
  return { host, parts, last: B.words.length ? B.words[B.words.length - 1] : null };
}

function buildCues() {
  SHEET.cues.forEach(c => {
    const el = c.element_id && document.getElementById(c.element_id);
    if (!el) { report('W_CUE_NO_ELEMENT', 'warning', 'cue ' + c.id + ' targets missing element ' + c.element_id); return; }
    if (c.kind === 'reveal') { if (!reveals[c.element_id] || c.at < reveals[c.element_id].at) reveals[c.element_id] = { el, at: c.at, draw: el.dataset.anim === 'draw' }; locks.push([c.at, c.at + LOCK_S]); }
    if (c.kind === 'emphasis') { pulses.push({ id: c.element_id, el, at: c.at }); locks.push([c.at, c.at + LOCK_S]); }
    if (c.kind === 'hold') { const until = isFinite(c.until) ? c.until : window.DURATION; locks.push([c.at, until]);
      if (SPEC.think && SPEC.think.element === c.element_id) think = Object.assign(think || {}, { at: c.at, until }); }
  });
  Object.values(reveals).forEach(r => {           // stroke timing inside a revealed element: outline, then hatch + fill
    const own = strokes.filter(s => r.el.contains(s.el));
    let outlineEnd = r.at;
    own.filter(s => !s.fill && !s.hatch).forEach(s => { s.t0 = r.at; s.dur = Math.min(1.2, Math.max(0.25, s.len / 1100)); outlineEnd = Math.max(outlineEnd, s.t0 + s.dur); });
    own.filter(s => s.hatch).forEach((s, i) => { s.t0 = outlineEnd + i * 0.05; s.dur = 0.2; });
    own.filter(s => s.fill).forEach(s => { s.t0 = outlineEnd; s.dur = 0.25; });
    r.texts = Array.from(r.el.querySelectorAll('text'));
    if (!r.draw) own.forEach(s => { s.t0 = undefined; });
  });
  (SPEC.swaps || []).forEach(([out, by]) => { const a = document.getElementById(out); if (a && reveals[by]) swaps.push({ el: a, at: reveals[by].at }); });
}
let merged = [];
function mergeLocks() { locks.sort((x, y) => x[0] - y[0]).forEach(([a, b]) => { const l = merged[merged.length - 1]; if (l && a <= l[1]) l[1] = Math.max(l[1], b); else merged.push([a, b]); }); }
const effT = t => { let e = t; merged.forEach(([a, b]) => { if (t > a) e -= Math.min(t, b) - a; }); return e; };   // drift clock frozen in lock windows

/* [11] RENDER - synchronous, pure function of t */
function render(t) {
  heads.forEach(h => {
    h.el.style.opacity = !h.words.length || t >= h.end ? 0 : 1 - prog(t, h.end - 0.2, 0.2);
    h.words.forEach(w => { w.el.style.opacity = prog(t, w.at, 0.18); w.el.style.transform = 'translateY(' + lerp(40, 0, prog(t, w.at, 0.35, 'backOut')).toFixed(2) + 'px) scale(' + lerp(0.8, 1, prog(t, w.at, 0.35, 'backOut')).toFixed(3) + ')'; });
  });
  const inThink = think && t >= think.start;
  const k = Math.floor((inThink ? think.start : t) * BOIL_FPS + EPS);   // boil step, frozen in the think window
  strokes.forEach(s => {
    if (s.boil) s.el.setAttribute('d', pathD(s.base, (s.seed ^ Math.imul(k + 1, 0x85EBCA6B)) >>> 0, WOBBLE_AMP + BOIL_AMP * 0.5, s.closed));
    if (s.t0 === undefined) { s.el.style.strokeDasharray = ''; s.el.style.opacity = ''; return; }
    if (s.fill) { s.el.style.opacity = prog(t, s.t0, s.dur); return; }
    const u = ease.p1InOut(clamp01((t - s.t0) / s.dur));
    s.el.style.strokeDasharray = '1 1'; s.el.style.strokeDashoffset = (1 - u).toFixed(4); s.el.style.opacity = u > 0 ? '' : 0;
  });
  const sc = {};
  Object.entries(reveals).forEach(([id, r]) => {
    const o = r.draw ? (t >= r.at ? 1 : 0) : prog(t, r.at, 0.25);
    r.el.style.opacity = o; sc[id] = r.draw ? 1 : lerp(0.6, 1, prog(t, r.at, 0.35, 'backOut'));
    if (r.draw) r.texts.forEach(x => { x.style.opacity = prog(t, r.at, 0.25); });
  });
  pulses.forEach(p => { sc[p.id] = (sc[p.id] == null ? 1 : sc[p.id]) * pulse(t, p.at); });
  Object.entries(sc).forEach(([id, s]) => { document.getElementById(id).style.transform = 'scale(' + s.toFixed(4) + ')'; });
  swaps.forEach(s => { const r = reveals[s.el.id], o = r ? (r.draw ? (t >= r.at ? 1 : 0) : prog(t, r.at, 0.25)) : 1; s.el.style.opacity = o * (1 - prog(t, s.at, 0.25)); });   // replaced value fades as its successor pops
  if (think && think.parts) {
    think.host.style.opacity = prog(t, think.start, 0.5) * (t <= think.until + EPS ? 1 : 0);
    think.parts.forEach(p => { p.el.style.opacity = 1; });
  }
  if (disc) disc.parts.forEach(p => { p.el.style.opacity = prog(t, p.at, 0.25); });
  const dx = -DRIFT_PX * effT(t) / window.DURATION;
  layers.forEach(l => l.el.setAttribute('transform', 'translate(' + (dx * l.par).toFixed(2) + ' 0)'));
}

/* [12] READY + SEEK */
window.FPS = FPS;
window.DURATION = 4.0;                                  // synchronous default; final value from the cue sheet in ready()
window.SCENE_META = { contract: '1.0.0', videoCount: 0, notes: 'phy-ohm-ci-01 ' + SPEC.id + ' doodle-handdrawn' };
window.ready = (async () => {
  const s = await loadJson(window.__CUE_SHEET__, 'cues', 'cue-sheet-inline', 'CUES'); SHEET = s.data; window.__cueSource = s.source; checkSheet(SHEET);
  const f = await loadJson(window.__FIXTURE__, 'fixture', 'fixture-inline', 'FIXTURE'); FX = deepFreeze(f.data); window.__fixtureSource = f.source;
  window.DURATION = SHEET.duration;
  window.FRAME_COUNT = Math.round(window.DURATION * FPS);
  if (SHEET.fps !== FPS) report('W_FPS_MISMATCH', 'warning', 'cue sheet fps ' + SHEET.fps + ' != render fps ' + FPS);
  await Promise.all(FONT_SPECS.map(f => document.fonts.load(f.weight + ' 40px "' + f.family + '"', f.text).catch(e => report('E_FONT_LOAD', 'error', f.family + ': ' + e.message))));
  document.querySelectorAll('[data-fx]').forEach(el => { el.textContent = String(fx(el.dataset.fx)); });   // read-only, unformatted
  buildZones(); buildStrokes(); buildBeats(); buildHeadlines();
  if (SPEC.think) { think = buildWordText(SPEC.think); }
  if (SPEC.disclosure) disc = buildWordText(SPEC.disclosure);
  buildCues();
  if (think) {
    if (!think.until) { report('W_THINK_NO_HOLD', 'warning', 'no hold cue for ' + SPEC.think.element + '; think plate runs to DURATION'); think.at = think.last ? think.last.t1 : 0; think.until = window.DURATION; locks.push([think.at, think.until]); }
    think.start = Math.max(think.at, think.last ? think.last.t1 + 0.1 : 0);   // silence begins after the last word
  }
  mergeLocks();
  document.querySelectorAll('g.layer').forEach(g => layers.push({ el: g, par: +g.dataset.par || 0 }));
  if (Q.get('safe') === '1') document.getElementById('stage').classList.add('safe');
  addEventListener('keydown', e => { if (e.key === 's' || e.key === 'S') document.getElementById('stage').classList.toggle('safe'); });
  await document.fonts.ready;
})().catch(e => { if (!e.code) report('E_READY', 'error', e.message); throw e; });

let chain = Promise.resolve();
window.seek = async function seek(t) {
  const prev = chain; let done; chain = new Promise(r => { done = r; });
  try {
    await prev; await window.ready;
    if (typeof t !== 'number' || !isFinite(t)) throw fail('E_BAD_T', 'seek(t) needs a finite number of seconds, got ' + t);
    const tc = Math.min(Math.max(t, 0), window.DURATION);
    render(tc);
    await document.fonts.ready;
    return { t: tc, frame: Math.round(tc * FPS) };
  } finally { done(); }
};
window.__hf = window.__hf || { get duration() { return window.DURATION; }, seek: t => window.seek(t) };
if (Q.get('preview') === '1') window.ready.then(() => { const r = document.createElement('input'); r.type = 'range'; r.min = 0; r.max = window.DURATION; r.step = 1 / FPS; r.value = 0; r.style.cssText = 'position:fixed;right:8px;top:8px;width:360px'; r.oninput = () => window.seek(parseFloat(r.value)); document.body.appendChild(r); });
if (Q.has('t')) window.ready.then(() => window.seek(num('t', 0)));
})();
</script>
