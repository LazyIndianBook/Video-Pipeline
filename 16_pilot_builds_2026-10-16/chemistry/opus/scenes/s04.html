  for (let y = z.y0 + 14, row = 0; y < z.y1 - 8; y += 24, row++) for (let x = 24 + (row % 2) * 12; x < W; x += 24) {
    const k = 1 - Math.abs(y - mid) / half; g.beginPath(); g.arc(x, y, 3 + 2 * k, 0, 6.2832); g.fill();

}

/* Chemistry builders. Formulas: symbol and subscript spans bound to display.species.<key>.parts[i]; coefficient bound to
   display.coefficients.<state>.<key>. Molecules: atom counts from parameters.species.<key> (computed in compute.py). */
function formula(key, coefState, id) {
  const s = el('span', 'formula'); if (id) s.id = id;
  if (coefState) { const c = el('span', 'coef', s); c.dataset.fx = 'display.coefficients.' + coefState + '.' + key; c.id = 'coef_' + key; }
  fx('display.species.' + key + '.parts').forEach((p, i) => {
    el('span', 'sym', s).dataset.fx = 'display.species.' + key + '.parts.' + i + '.symbol';
    if (p.sub !== '') el('sub', '', s).dataset.fx = 'display.species.' + key + '.parts.' + i + '.sub';
  });
  return s;
}
const op = (name, id) => { const s = el('span', 'op'); s.dataset.fx = 'display.ops.' + name; if (id) s.id = id; return s; };
// Equation row: cells [lhs1, plus, lhs2, arrow, rhs]; widths sum to the 864 px safe band. Returns cell centre xs.
const CELLS = [212, 92, 190, 100, 270];
function equation(parent, y, eqKey, coefState, ids, fontPx) {   // y is relative to parent; xs are stage x
  const row = el('div', 'eq', parent); row.style.left = (LEFT - parseFloat(parent.style.left || 0)) + 'px'; row.style.top = y + 'px'; if (fontPx) row.style.fontSize = fontPx + 'px';
  if (ids.eq) row.id = ids.eq;
  const E = fx('parameters.equations.' + eqKey), items = [formula(E.lhs[0][1], coefState, ids.f && ids.f[0]), op('plus', ids.plus), formula(E.lhs[1][1], coefState, ids.f && ids.f[1]), op('arrow', ids.arrow), formula(E.rhs[0][1], coefState, ids.f && ids.f[2])];
  const xs = []; let x = LEFT;
  items.forEach((it, i) => { const c = el('div', 'cell', row); c.style.width = CELLS[i] + 'px'; c.appendChild(it); xs.push(x + CELLS[i] / 2); x += CELLS[i]; });
  return { row, xs, keys: [E.lhs[0][1], null, E.lhs[1][1], null, E.rhs[0][1]] };
}
const R = { H: 24, O: 38 }, FILL = { H: PAPER, O: TEAL };
function atomLayout(key) {
  const comp = fx('parameters.species.' + key), nH = comp.H || 0, heavy = [];
  Object.keys(comp).forEach(e => { if (e !== 'H') for (let i = 0; i < comp[e]; i++) heavy.push(e); });
  if (Object.keys(comp).some(e => !(e in R))) throw fail('E_FIXTURE_MISSING', 'no atom style for ' + key);
  const atoms = [];
  if (!heavy.length) for (let i = 0; i < nH; i++) atoms.push({ e: 'H', x: (i - (nH - 1) / 2) * R.H * 1.5, y: 0 });
  else {
    const n = heavy.length;
    if (n === 1 && nH > 2) throw fail('E_LAYOUT', 'layout handles at most 2 H on one centre');
    if (n === 1) for (let i = 0; i < nH; i++) { const a = (i ? 1 : -1) * 0.91; atoms.push({ e: 'H', x: Math.sin(a) * (R.O + R.H * 0.5), y: Math.cos(a) * (R.O + R.H * 0.5) }); }   // bent, about 104 deg
    heavy.forEach((e, i) => atoms.push({ e, x: (i - (n - 1) / 2) * R.O * 1.55, y: 0 }));
    if (n > 1) for (let i = 0; i < nH; i++) { const end = atoms[(i % 2 ? n - 1 : 0)]; atoms.unshift({ e: 'H', x: end.x + (i % 2 ? 1 : -1) * R.O * 1.0, y: (i % 2 ? -1 : 1) * R.O * 1.15 }); }
  }

}
// Draws `copies` molecules of `key` stacked vertically around (cx, cy). Hard flat shadow + 6 px paper keyline (editorial-vox §3).
const ATOMS = [];   // world positions of drawn atoms (for halos), filled by molecule()
function molecule(parent, key, cx, cy, copies, scale, id) {
  const g = svgEl('g', {}, parent); if (id) { g.id = id; g.classList.add('cue'); }
  const atoms = atomLayout(key), sc = scale || 1, hgt = (Math.max(...atoms.map(a => a.y + R[a.e])) - Math.min(...atoms.map(a => a.y - R[a.e]))) * sc, gap = 26;
  const top = Math.min(...atoms.map(a => a.y - R[a.e])) * sc;
  for (let k = 0; k < copies; k++) {
    const oy = cy - ((copies - 1) * (hgt + gap)) / 2 + k * (hgt + gap) - (top + hgt / 2);
    const m = svgEl('g', { transform: 'translate(' + cx + ',' + oy + ') scale(' + sc + ')' }, g);
    atoms.forEach(a => svgEl('circle', { cx: a.x + 8 / sc, cy: a.y + 8 / sc, r: R[a.e] + 6, fill: 'rgba(20,33,61,0.18)' }, m));
    atoms.forEach(a => svgEl('circle', { cx: a.x, cy: a.y, r: R[a.e] + 6, fill: PAPER }, m));
    atoms.forEach(a => svgEl('circle', { cx: a.x, cy: a.y, r: R[a.e], fill: FILL[a.e], stroke: INK, 'stroke-width': 3, 'data-atom': a.e }, m));
    atoms.forEach(a => ATOMS.push({ key, id, e: a.e, x: cx + a.x * sc, y: oy + a.y * sc, r: R[a.e] * sc }));

}
function card(parent, x, y, w, h, id) { const c = el('div', 'card', parent); Object.assign(c.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); if (id) c.id = id; return c; }
function fillFx() { document.querySelectorAll('[data-fx]').forEach(e => { e.textContent = String(fx(e.dataset.fx)); }); }
const relBox = (e) => { const r = e.getBoundingClientRect(), s = $('stage').getBoundingClientRect(); return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height }; };

/* [SCENE] scene-specific build(layer) and draw(t) */
/* s04 subscript trap: editorial A-over-B comparison in two equal frames. A: the tempting H2O2 (subscript changed, highlighted).
   B: the coefficient fix (two water molecules). Names come from the fixture; no red cross (correct by explanation). */
function frame(id, y, key, coefState, copies, nameId) {
  const f = card($('stage'), 72, y, 936, 290, id); f.classList.add('frame', 'cue'); f.dataset.reveal = '1';
  const row = el('div', 'eq', f); row.style.left = '44px'; row.style.top = '58px'; row.appendChild(formula(key, coefState, id + '_formula'));
  const name = el('div', 'label', f); name.dataset.fx = 'display.species.' + key + '.name'; if (nameId) { name.id = nameId; name.classList.add('cue'); name.dataset.reveal = '1'; }
  const svg = svgEl('svg', { width: 936, height: 290, viewBox: '0 0 936 290' }, f);
  molecule(svg, key, 700, 145, copies, copies > 1 ? 0.95 : 1.25);

}
function build(under, over) {
  buildHeadline({ beat: 0, words: [['a', 1], ['different', 1], ['substance', 1, true]] });
  frame('frame_a', 540, 'H2O2', null, 1, 'name_a');
  const hl = el('div', '', $('frame_a')); hl.id = 'hl_sub'; hl.dataset.emph = 'swipe'; hl.classList.add('cue'); hl.dataset.reveal = '1';
  $('frame_a').insertBefore(hl, $('frame_a').firstChild);
  const yd = 858; svgEl('line', { x1: 330, y1: yd, x2: 750, y2: yd, stroke: SEC, 'stroke-width': 3 }, over);
  svgEl('rect', { x: 528, y: yd - 12, width: 24, height: 24, transform: `rotate(45 540 ${yd})`, fill: PAPER, stroke: SEC, 'stroke-width': 3 }, over);
  frame('frame_b', 886, 'H2O', 'balanced', fx('parameters.equations.balanced.rhs.0.0'));
}
function afterLayout() {   // highlighter sits exactly behind the subscript that was changed (last part of H2O2)
  const f = relBox($('frame_a')), subs = $('frame_a_formula').querySelectorAll('sub'), b = relBox(subs[subs.length - 1]);
  Object.assign($('hl_sub').style, { left: (b.x - f.x - 10) + 'px', top: (b.y - f.y - 4) + 'px', width: (b.w + 20) + 'px', height: (b.h + 8) + 'px' });
}
function draw(t) {}


/* [11] RENDER - pure function of t */
function render(t) { renderCues(t); draw(t); }

/* [12] READY + SEEK */
window.FPS = FPS;
window.DURATION = 10.0;
window.SCENE_META = { contract: '1.0.0', videoCount: 0, notes: 'chem-balance-ci-01 s04: The subscript trap' };
window.ready = (async () => {
  const s = await loadJson(window.__CUE_SHEET__, 'cues', 'cue-sheet-inline', 'CUES'); SHEET = s.data; window.__cueSource = s.source; checkSheet(SHEET);
  const f = await loadJson(window.__FIXTURE__, 'fixture', 'fixture-inline', 'FIXTURE'); FX = deepFreeze(f.data); window.__fixtureSource = f.source;
  window.DURATION = SHEET.duration;
  window.FRAME_COUNT = Math.round(window.DURATION * FPS);
  if (SHEET.fps !== FPS) report('W_FPS_MISMATCH', 'warning', 'cue sheet fps ' + SHEET.fps + ' != render fps ' + FPS);
  await Promise.all(FONT_SPECS.map(f => document.fonts.load(f.weight + ' 40px "' + f.family + '"', f.text).catch(e => report('E_FONT_LOAD', 'error', f.family + ': ' + e.message))));
  buildZones(); paintPaper();
  const mk = () => svgEl('svg', { class: 'layer', width: W, height: H, viewBox: '0 0 ' + W + ' ' + H });
  const under = mk(), over = mk(); $('cv').after(under); $('stage').appendChild(over);   // under: highlighters; over: drawings
  build(under, over);
  fillFx();                                             // read-only, unformatted
  await document.fonts.ready;
  buildCues(); afterLayout();
  if (Q.get('safe') === '1') $('stage').classList.add('safe');
  addEventListener('keydown', e => { if (e.key === 's' || e.key === 'S') $('stage').classList.toggle('safe'); });
})().catch(e => { if (!e.code) report('E_READY', 'error', e.message); throw e; });

let chain = Promise.resolve();
window.seek = async function seek(t) {
  const prev = chain; let done; chain = new Promise(r => { done = r; });
  try {
    await prev; await window.ready;
    if (typeof t !== 'number' || !isFinite(t)) throw fail('E_BAD_T', 'seek(t) needs a finite number of seconds, got ' + t);
    const tc = Math.min(Math.max(t, 0), window.DURATION);
    render(tc);
    await document.fonts.ready;
    return { t: tc, frame: Math.round(tc * FPS) };
  } finally { done(); }
};
window.__hf = window.__hf || { get duration() { return window.DURATION; }, seek: t => window.seek(t) };
if (Q.get('preview') === '1') window.ready.then(() => { const r = el('input', '', document.body); r.type = 'range'; r.id = 'scrub'; r.min = 0; r.max = window.DURATION; r.step = 1 / FPS; r.value = 0; r.oninput = () => window.seek(parseFloat(r.value)); });
if (Q.has('t')) window.ready.then(() => window.seek(num('t', 0)));
})();
