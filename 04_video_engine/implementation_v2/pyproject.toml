[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "examleaf-video-engine"
version = "0.1.0"
description = "Offline deterministic STEM rendering proof and production architecture"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "numpy>=2,<3", "scipy>=1.14,<2", "sympy>=1.13,<2", "CairoSVG>=2.7,<3", "Pillow>=11,<13", "pdfplumber>=0.11,<1"]

[project.optional-dependencies]
chemistry = ["rdkit>=2025.9,<2027"]
test = ["pytest>=8,<10", "reportlab>=4,<5"]

[project.scripts]
examleaf = "examleaf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
