<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280"><rect x="0" y="0" width="720" height="1280" rx="0" fill="#F7F9FC" stroke="none"/><rect x="0" y="0" width="720" height="8" rx="0" fill="#087986" stroke="none"/><text x="42" y="53.0" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#087986" text-anchor="start">EXAMLEAF</text><text x="678" y="53.0" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#526074" text-anchor="end">PHYSICS</text><text x="42" y="113.0" font-family="DejaVu Sans" font-size="42" font-weight="700" fill="#14213D" text-anchor="start">Charging takes time</text><rect x="36" y="220" width="610" height="375" rx="18" fill="#FFFFFF" stroke="none"/><rect x="36" y="619" width="610" height="355" rx="18" fill="#FFFFFF" stroke="none"/><line x1="100" y1="464.5" x2="620" y2="464.5" stroke="#D9E1EC" stroke-width="1"/><line x1="100" y1="399.0" x2="620" y2="399.0" stroke="#D9E1EC" stroke-width="1"/><line x1="100" y1="333.5" x2="620" y2="333.5" stroke="#D9E1EC" stroke-width="1"/><line x1="100" y1="268" x2="620" y2="268" stroke="#D9E1EC" stroke-width="1"/><line x1="100" y1="530" x2="620" y2="530" stroke="#14213D" stroke-width="2"/><line x1="100" y1="530" x2="100" y2="268" stroke="#14213D" stroke-width="2"/><text x="100" y="250.0" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#526074" text-anchor="start">Capacitor voltage (V)</text><text x="360.0" y="583.0" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#526074" text-anchor="middle">Time / RC</text><text x="86" y="535.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#14213D" text-anchor="end">0</text><path d="M 100.000,530.000 L 106.500,514.126 L 113.000,499.214" fill="none" stroke="#185ABD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="116.5079365079365" y1="530" x2="116.5079365079365" y2="491.5453596757158" stroke="#087986" stroke-width="2" stroke-dasharray="6 6"/><circle cx="116.5079365079365" cy="491.5453596757158" r="8" fill="#087986" stroke="none" stroke-width="2"/><text x="620" y="557.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#14213D" text-anchor="end">5</text><text x="204.0" y="557.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#14213D" text-anchor="middle">1</text><text x="88" y="275.0" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#14213D" text-anchor="end">10</text><text x="61" y="667.0" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#526074" text-anchor="start">IDEAL RC CIRCUIT</text><text x="61" y="721.0" font-family="DejaVu Sans" font-size="34" font-weight="400" fill="#14213D" text-anchor="start">V/V₀ = 1 − exp(−t/RC)</text><text x="61" y="772.0" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#14213D" text-anchor="start">R = 10 kΩ C = 100 μF</text><text x="61" y="817.0" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#185ABD" text-anchor="start">RC = 1 second</text><text x="61" y="880.0" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#087986" text-anchor="start">1.47 V</text><text x="61" y="926.0" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#14213D" text-anchor="start">Supply: 10 V • initially uncharged</text><text x="42" y="1040.0" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#14213D" text-anchor="start">Voltage rises quickly, then</text><text x="42" y="1078.75" font-family="DejaVu Sans" font-size="31" font-weight="400" fill="#14213D" text-anchor="start">approaches the supply more slowly.</text><text x="42" y="1237.0" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#526074" text-anchor="start">TECHNICAL PREVIEW • NO AUDIO • REVIEW PENDING</text><rect x="42" y="1257" width="636" height="4" rx="0" fill="#D9E1EC" stroke="none"/><rect x="42" y="1257" width="42.4" height="4" rx="0" fill="#087986" stroke="none"/></svg>