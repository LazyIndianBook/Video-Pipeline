<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 220" width="1040" height="220" role="img" aria-label="Professor Diki Simplified">
  <!-- Professor Diki Simplified wordmark v2.0.0 (paper cut-out collage, PD-19): the brand STICKER. One black plaque #2B2622
       with the 8 px cream die-cut outline #FFFDF7, the soft double shadow and a pink washi strip; "Professor Diki" in Georgia
       bold cream #FBF7EE, "Simplified" in the sans heavy mustard #E0A73A (6.95:1 on the plaque). Rotated -2 deg about the
       centre. textLength fixes each run, so placement never depends on font metrics. Same design as the opening ident and
       the end-card wordmark that diki_runtime.js draws (tokens.brand.sticker). Exact brand string; nothing else. -->
  <defs>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/><feOffset dy="9" result="o1"/>
      <feFlood flood-color="#4A3016" flood-opacity="0.30"/><feComposite in2="o1" operator="in" result="s1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.75"/><feOffset dy="2" result="o2"/>
      <feFlood flood-color="#000" flood-opacity="0.20"/><feComposite in2="o2" operator="in" result="s2"/>
      <feMerge><feMergeNode in="s1"/><feMergeNode in="s2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="rotate(-2 520 110)">
    <g filter="url(#sh)">
      <rect x="40" y="46" width="960" height="132" rx="14" fill="#FFFDF7"/>
      <rect x="48" y="54" width="944" height="116" rx="10" fill="#2B2622"/>
    </g>
    <text x="92" y="136" textLength="540" lengthAdjust="spacingAndGlyphs" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#FBF7EE">Professor Diki</text>
    <text x="664" y="136" textLength="292" lengthAdjust="spacingAndGlyphs" font-family="'Kohinoor Devanagari', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="#E0A73A">Simplified</text>
    <rect x="150" y="30" width="150" height="40" fill="#F1A9A0" fill-opacity="0.72" transform="rotate(-6 225 50)"/>
  </g>
</svg>
