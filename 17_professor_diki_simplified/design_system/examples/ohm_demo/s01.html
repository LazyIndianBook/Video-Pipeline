<style>/* inlined diki_scene.css */
/* diki_scene.css - Professor Diki Simplified stage styles, design system v2.0.0 (paper cut-out collage, PD-19).
   Linked by diki_scene_base.html after tokens.css; build_scene.py inlines it. Hand-written (tokens.css is generated).
   Nothing here moves by itself: no transition, no keyframes. Static rotation of tape is the only CSS transform; every
   changing opacity / transform / attribute is written by diki_runtime.js from seek(t). */
html,body{margin:0;background:var(--hue-cream)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--hue-cream);font-family:var(--font-sans);color:var(--c-ink)}
/* layers, back to front: world (bands, grain, sparkles) < sheets (paper backdrops of result/card) < underlay (halos)
   < lanes (content, transparent) < overlay (links, strikes, rings, tape) < ident */
#world,#underlay,#overlay{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
#world{z-index:0}
#sheets{position:absolute;inset:0;z-index:1;pointer-events:none}
#underlay{z-index:2}
.lane{position:absolute;box-sizing:border-box;z-index:3}
#overlay{z-index:4}
#ident{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;font-size:var(--t-ident);font-weight:800;color:var(--c-ink)}

/* ransom-note chips: one word per chip, cream die-cut border, soft double shadow (style classes .chip-<name> in tokens.css) */
.chip{display:inline-block;box-sizing:border-box;font-size:var(--t-chip);font-weight:800;line-height:var(--chip-line);padding:var(--chip-pad);border:var(--chip-border) solid var(--outline);border-radius:var(--chip-radius);box-shadow:var(--shadow);white-space:nowrap}
.chip.lbl{font-size:var(--t-label);line-height:1.15;padding:2px 20px 6px;font-family:var(--font-sans)}
.chip.readout{font-size:var(--t-readout);line-height:1.1;padding:4px 22px 8px;font-family:var(--font-sans)}
.chiprow{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:12px 16px;max-width:100%}
/* zero-size anchor: a chip placed by its centre (or right/left edge) at x,y of its lane */
.anchor{position:absolute;width:0;height:0;display:flex;align-items:center;justify-content:center;overflow:visible}
.anchor.end{justify-content:flex-end}
.anchor.start{justify-content:flex-start}

/* the brand sticker (opening ident, end-card wordmark): one black plaque, cream outline, pink washi; serif + sans */
.brand-sticker{position:relative;display:inline-block;box-sizing:border-box;border:var(--chip-border) solid var(--outline);box-shadow:var(--shadow);padding:6px 30px 12px;font-weight:800;line-height:1.08;white-space:nowrap;text-align:center}
.brand-sticker.two .bs2{display:block}
.brand-sticker .tape{top:-18px}
/* paper sheets: cream paper, die-cut outline, soft shadow, washi tape. Never a flat white panel. */
.sheet{position:absolute;box-sizing:border-box;background:var(--sheet-fill);border:var(--sheet-border) solid var(--outline);border-radius:var(--sheet-radius);box-shadow:var(--shadow)}
.tape{position:absolute;width:var(--tape-w);height:var(--tape-h);top:-20px;margin-left:calc(var(--tape-w) / -2);z-index:1}

/* title lane: one owner at a time (headline chips | think plate | wordmark chips), stacked in one grid cell */
#lane-title{display:grid;place-items:center}
#lane-title>*{grid-area:1/1;opacity:0}
.plate{position:relative;font-size:var(--t-think);font-weight:800;line-height:1.1;padding:14px 44px 18px;color:var(--c-ink)}
/* result lane = a taped paper sheet: running result; on the end card the "Free lesson" chip */
#result-main,#endline-wrap{position:absolute;inset:0}
#endline-wrap{display:flex;align-items:center;justify-content:center}
#endline{font-size:var(--t-endline)}
/* caption lane (layout 'captioned'): the current chunk as one paper chip */
.caption{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}
.caption>span{background:var(--sheet-fill);border:var(--chip-border) solid var(--outline);border-radius:var(--chip-radius);box-shadow:var(--shadow);padding:4px 22px 8px;font-size:var(--t-caption);font-weight:700;line-height:1.2;text-align:center;max-width:820px;color:var(--c-ink)}
/* card lane (layout 'carded', PD-18): ONE structured element at a time on a taped paper sheet; rows appear whole */
#lane-card{padding:16px 30px 12px;display:grid}
.card{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;min-height:0;opacity:0;font-size:var(--t-card);font-weight:700;line-height:1.15;color:var(--c-ink)}
.card-row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:center;height:58px;text-align:center;opacity:0}
.card-row.card-head{color:var(--c-muted);font-weight:800;border-bottom:3px solid rgba(58,51,44,.28)}
.card-table{justify-content:flex-start;background-image:repeating-linear-gradient(to bottom,transparent 0 56px,rgba(58,51,44,.16) 56px 59px);background-position:0 3px;background-size:100% calc(100% - 3px);background-repeat:no-repeat}
.card-table .card-head{border-bottom-color:transparent}
.card-slot{justify-self:center;display:inline-block;min-width:110px;height:50px;line-height:50px;border-bottom:4px dashed rgba(58,51,44,.32)}
.card-slot>.card-cell{display:inline-block;width:100%}
.card-row.card-def{display:block;height:auto;text-align:left;padding:4px 0}
.card-term{display:inline-block;font-weight:800;margin-bottom:10px}
.card-text{font-weight:700}
.card-row.card-point{grid-auto-flow:row;grid-template-columns:76px 1fr;text-align:left}
.card-num{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--hue-black);color:var(--hue-paper);font-size:40px;font-weight:800;border:4px solid var(--outline);box-shadow:var(--shadow)}
/* debug: ?safe=1 outlines the lanes (never in production frames) */
.safe .lane{outline:2px dashed var(--c-mismatch)}
#scrub{position:fixed;right:8px;top:8px;width:360px;z-index:9}
</style>

    const y = laneY(b.top); if (y == null) return;
    const g = D.svg('g', { 'data-band-name': b.name }, svg);
    torn(g, y, b.fill, b.seed, k);
    if (b.texture) texture(g, b.texture, y, b.seed + 100, k);
    D.world.bands.push({ name: b.name, y: Math.round(y), fill: b.fill });
  });
  D.svg('rect', { width: 1080, height: 1920, filter: 'url(#grain)', opacity: Wt.grain_opacity }, svg);
  D.svg('rect', { width: 1080, height: 1920, fill: 'url(#vig)' }, svg);
  const under = y => { let f = T.color.hue.cream; for (const b of D.world.bands) if (b.y <= y) f = b.fill; return f; };
  const dark = h => { const c = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] < 90; };
  Wt.sparkles.forEach(([x, y, s]) => sparkle(svg, x, y, s, dark(under(y)) ? T.color.hue.paper : T.color.ink));   // cream sparkles on dark bands
}
/* paper backdrops of the result and card lanes (a layer under the halos, so Emphasize shows on a sheet) */
const backdrops = {};
function buildSheets() {
  let host = document.getElementById('sheets'); if (!host) { host = D.div('', STAGE); host.id = 'sheets'; }
  ['result', 'card'].forEach(name => {
    const z = LAYOUT[name]; if (!z) return;
    const s = D.sheetEl(host, { x: T.lanes.x0, y: z.y0, w: T.lanes.x1 - T.lanes.x0, h: z.y1 - z.y0 }, name === 'card' ? [['teal', 0.12], ['mustard', 0.88]] : T.sheet.tapes);
    s.id = 'sheet-' + name; backdrops[name] = s;
  });
}
D.backdrop = name => backdrops[name] || null;

/* =========================== CHROME: lanes, ident, headlines, think plate, end card =========================== */
function placeLanes() {
  const x0 = T.lanes.x0, w = T.lanes.x1 - T.lanes.x0;
  ['title', 'diagram', 'result', 'caption', 'card'].forEach(name => {
    const el = document.getElementById('lane-' + name); if (!el) return;
    const z = LAYOUT[name];
    if (!z) { el.style.display = 'none'; return; }
    el.style.left = x0 + 'px'; el.style.width = w + 'px'; el.style.top = z.y0 + 'px'; el.style.height = (z.y1 - z.y0) + 'px';
  });
  const id = document.getElementById('ident'), iz = T.lanes.ident;
  if (id) { id.style.left = x0 + 'px'; id.style.width = w + 'px'; id.style.top = iz.y0 + 'px'; id.style.height = (iz.y1 - iz.y0) + 'px'; }
  D.lane = name => { const z = LAYOUT[name]; return z ? { x: x0, y: z.y0, w, h: z.y1 - z.y0, el: document.getElementById('lane-' + name) } : null; };
}

const norm = w => String(w).normalize('NFC').toLowerCase().replace(/[^\p{L}\p{M}\p{N}'’]/gu, '');
const isOutro = b => T.brand.endcard_slots.includes(b.slot);

D.buildChrome = function () {
  const titleLane = document.getElementById('lane-title'), B = T.brand;

  // 0. opening ident (PD-21): the brand sticker over the complete board from frame 0, gone by out_end_s
  const ident = document.getElementById('ident');
  if (ident) {
    if (ident.textContent.trim() !== B.wordmark) report('E_BRAND', 'error', 'ident text "' + ident.textContent.trim() + '" != tokens.brand.wordmark');
    ident.textContent = '';
    const st = D.brandSticker(ident, B.wordmark, { size: T.type.ident.size, rot: B.ident.rot_deg });
    D.Pop(st, 0, { until: B.ident.hold_until_s, dur: B.ident.out_dur_s });
    D.identEl = ident;
  }

  // 1. headlines as ransom chips, one per beat with a headline; the whole phrase pops together at its first
  //    headline word as spoken in that beat (the first beat's headline is up at t = 0: frame 0 carries the question)
  const heads = [];
  BEATS.forEach((b, bi) => {
    if (!b.headline || isOutro(b)) return;
    const el = D.chipRow(titleLane, b.headline, { lang: SHEET.language });
    const nWords = b.headline.split(/\s+/).filter(x => norm(x)).length;
    if (nWords > T.type.headline.max_words) report('W_HEADLINE_LONG', 'warning', b.id + ' headline has ' + nWords + ' words > ' + T.type.headline.max_words);
    let at = null;
    if (bi === 0) at = 0;
    else {
      const want = new Set(b.headline.split(/\s+/).map(norm).filter(Boolean));
      const [s, e] = b.word_range || [0, 0];
      for (let i = s; i < e; i++) if (want.has(norm(SHEET.words[i].w))) { at = Math.max(0, SHEET.words[i].t0 - LEAD); break; }
      if (at == null) { at = Math.max(0, b.start - LEAD); report('W_HEADLINE_UNMATCHED', 'warning', b.id + ' headline words not found in its spoken words; shown at beat start'); }
    }
    heads.push({ el, at, id: b.id });
    D.Chips(el, at);
    if (el.scrollHeight > titleLane.clientHeight + 1 || el.scrollWidth > titleLane.clientWidth + 1) report('W_HEADLINE_OVERFLOW', 'warning', b.id + ' headline does not fit the title lane at ' + T.type.headline.size + ' px');
  });
  heads.sort((a, b) => a.at - b.at);

  // 2. think plate: a taped paper sheet with the prompt (display.ui.think_prompt)
  const plate = document.getElementById('think-plate');
  if (plate) { plate.classList.add('sheet', 'plate'); const tp = D.div('tape tape-mustard', plate); tp.style.left = '50%'; tp.style.transform = 'rotate(-4deg)'; }

  // 3. end card = the final STATE of this scene: wordmark chips (display.ui.endcard_line1 == brand) in the title lane
  //    and the "Free lesson: <topic>" chip (display.ui.endcard_line2) on the result sheet. It triggers on the LAST
  //    outro.brand (v2) or outro.disclosure (v1) beat; that beat's text is never shown (PD-20).
  const outro = BEATS.filter(isOutro).pop();
  D.endCardAt = outro ? Math.max(0, outro.start - LEAD) : null;
  const wm = document.getElementById('wordmark'), endWrap = document.getElementById('endline-wrap');
  if (wm) {
    const line1 = String(D.fx(wm.dataset.fx || 'display.ui.endcard_line1'));
    if (line1 !== B.wordmark) report('E_BRAND', 'error', 'end-card line 1 "' + line1 + '" != brand "' + B.wordmark + '"');
    wm.textContent = ''; const st = D.brandSticker(wm, line1, { size: T.type.wordmark.size, twoLine: true, rot: -1.5 });
    if (D.endCardAt != null) D.Pop(st, D.endCardAt);
  }
  const endline = document.getElementById('endline');
  if (endline) {
    D.bindFx(endline.parentNode);
    if (!/^Free lesson: .+/.test(endline.textContent)) report('W_ENDLINE', 'warning', 'end-card line 2 should read "Free lesson: <topic>", got "' + endline.textContent + '"');
    endline.classList.add('chip', 'chip-black'); endline.dataset.rot = '-1.5';
    if (D.endCardAt != null) D.Pop(endline, D.endCardAt + MV.Pop.dur * 0.5); else endline.style.opacity = 0;
  }
  if (!outro) report('W_NO_END_CARD', 'warning', 'no outro.brand / outro.disclosure beat: no end card');
  if (D.endCardAt != null && window.DURATION - D.endCardAt < T.motion.end_card_min_s - EPS) report('W_END_CARD_SHORT', 'warning', 'end card ' + (window.DURATION - D.endCardAt).toFixed(2) + ' s < ' + T.motion.end_card_min_s + ' s');

  // 4. title-lane owner at time t: end card > think plate > latest headline
  const ownerAt = t => {
    if (D.endCardAt != null && t >= D.endCardAt - EPS) return wm;
    for (const w of THINK) if (t >= w.start - EPS && t < w.end - EPS) return plate;
    let h = null; for (const x of heads) if (x.at <= t + EPS) h = x.el;
    return h;
  };
  const times = [0].concat(heads.map(h => h.at), THINK.flatMap(w => [w.start, w.end]), D.endCardAt == null ? [] : [D.endCardAt]).sort((a, b) => a - b);
  const segs = [];
  times.forEach(tt => { const o = ownerAt(tt); if (!segs.length || segs[segs.length - 1].el !== o) segs.push({ el: o, t0: tt }); });
  const owned = [...new Set(heads.map(h => h.el).concat([plate, wm]).filter(Boolean))];
  const dur = MV.Headline.dur;
  const resultMain = document.getElementById('result-main');
  D.track(t => {
    for (const el of owned) {
      let o = 0;
      segs.forEach((s, i) => {
        if (s.el !== el) return;
        const next = segs[i + 1];
        const pin = s.t0 <= EPS ? 1 : D.prog(t, s.t0, dur, 'out');
        o = Math.max(o, pin - (next ? D.prog(t, next.t0, dur, 'out') : 0));
      });
      el.style.opacity = s0(o);
    }
    const e = D.endCardAt == null ? 0 : D.prog(t, D.endCardAt, dur, 'out');
    if (resultMain) resultMain.style.opacity = s0(1 - e);                    // the result gives way to the free-lesson chip
  });
  D.headlines = heads;
};

/* hero registration for the fill check */
const heroes = [];
D.hero = el => { heroes.push(el); return el; };

/* =========================== READY-TIME QA =========================== */
D.finalize = function () {
  const lane = D.lane('diagram'), qa = { layout: D.layoutName, subject: D.subject, diagram_share: +(lane.h / T.canvas.height).toFixed(3) };
  const shareMin = T.fill['diagram_min_share' + ({ captioned: '_captioned', carded: '_carded' }[D.layoutName] || '')];
  if (qa.diagram_share + 1e-9 < shareMin) report('W_DIAGRAM_SHARE', 'warning', 'diagram lane ' + qa.diagram_share + ' of frame < ' + shareMin);
  if (!heroes.length) report('W_NO_HERO', 'warning', 'no persistent hero object registered (Diki.hero)');
  qa.hero_fill = heroes.map(h => { const b = D.box(h); return { id: h.id, fill: +(b.h / lane.h).toFixed(3), top: Math.round(b.y), bottom: Math.round(b.y + b.h) }; });
  qa.hero_fill.forEach(f => { if (f.fill < T.fill.hero_min_of_diagram) report('W_FILL_LOW', 'warning', 'hero ' + f.id + ' fills ' + f.fill + ' of the diagram lane < ' + T.fill.hero_min_of_diagram); });
  qa.motion_in_think = [];
  THINK.forEach(w => intervals.forEach(iv => { if (!iv.still && iv.t0 < w.end - EPS && iv.t1 > w.start + EPS) qa.motion_in_think.push(iv.verb + '@' + iv.t0.toFixed(2)); }));
  if (qa.motion_in_think.length) report('W_MOTION_IN_THINK', 'warning', 'motion during a think window: ' + qa.motion_in_think.join(', '));
  qa.world = { subject: D.subject, bands: (D.world && D.world.bands) || [] };
  if (!document.getElementById('world') || !qa.world.bands.length) report('W_WORLD_MISSING', 'warning', 'no world layer (#world with torn-paper bands)');
  qa.ident = D.identEl ? D.identEl.textContent.trim() : null;
  if (qa.ident !== T.brand.wordmark) report('W_IDENT_MISSING', 'warning', 'opening ident missing or not the brand');
  qa.verbs = intervals.map(iv => iv.verb + '@' + iv.t0.toFixed(2) + '+' + (iv.t1 - iv.t0).toFixed(2));
  qa.end_card_s = D.endCardAt == null ? 0 : +(window.DURATION - D.endCardAt).toFixed(2);
  window.__diki_qa = qa;
};

/* =========================== RENDER =========================== */
D.render = t => { for (const fn of tracks[0]) fn(t); for (const fn of tracks[1]) fn(t); };
})();
</script>
<script>/* inlined badge.js */
/* components/badge.js - condition / assumption / mismatch / result / scale badges as label CHIPS (design system v2.0.0).
 *
 * mount(container, fixture, opts) -> { el, set(state), box }
 *   container: an SVG element (the chip is placed in that SVG's user space = its HTML host's px) or an HTML element
 *   opts: { fx: 'display.condition', style: 'condition'|'assumption'|'mismatch'|'result'|'scale', x, y (centre), id }
 *   set({ opacity: 0..1, dim: 0..1 })  dim > 0.5: the chip turns to muted grid paper (a condition that no longer
 *   holds; pair it with StrikeThrough for the shape cue).
 * The label text is a fixture value (data-fx). Chip colour = meaning (tokens.chips.roles via tokens.badge).
 */
(function () {
'use strict';
const D = window.Diki;

function mount(container, fixture, opts) {
  const T = D.T, role = T.badge[opts.style || 'condition'] || 'label';
  const host = D.hostOf(container);
  const style = T.chips.roles[role], mutedStyle = T.chips.roles.muted;
  const el = D.chip(null, { fx: opts.fx, role, kind: 'lbl', id: opts.id, rot: opts.rot == null ? -1.5 : opts.rot });
  D.place(el, host, opts.x, opts.y, opts.anchor || 'middle');
  const base = el.className.replace('chip-' + style, '').replace(/\s+/g, ' ').trim(), fg = T.chips.styles.find(x => x.name === style).fg;
  function set(s) {                                   // writes the whole class and colour every time: same DOM for the same t
    if (s.opacity != null) el.style.opacity = D.op(s.opacity);
    const d = (s.dim || 0) > 0.5;
    el.className = base + ' chip-' + (d ? mutedStyle : style);
    el.style.color = d ? D.color('muted') : fg;
  }
  const r = el.getBoundingClientRect();
  return { el, set, box: { x: opts.x - r.width / 2, y: opts.y - r.height / 2, w: r.width, h: r.height } };
}

D.Components.badge = { mount };
})();
</script>
<script>/* inlined equation.js */
/* components/equation.js - result/equation lane: term-by-term layouts with identity (design system v2.0.0: terms are text on the result sheet; colour by meaning).
 *
 * mount(container, fixture, opts) -> { svg, el(id), set({from, to, p}), drive(steps, {initial}) }
 *   opts.terms:  { id: { parts: [ {fx: 'path', dec?: 'path'|n} ... ], role: 'voltage'|'current'|'resistance'|'ink'|'muted'|'mismatch',
 *                        italic?: true (quantity symbols) } }
 *   opts.states: { name: { layout: 'line', terms: [ids], size? }
 *                       | { layout: 'grid', rows: [ { l: [ids], m: [ids], r: [ids] } ... ], size? },
 *                  ...  optional per state: roles: { id: role } (e.g. the expected value muted in a mismatch) }
 * Every glyph (operators too) comes from the fixture. A term id that appears in two states is ONE object:
 * EquationTransform moves it (x, y, font-size as SVG attributes); terms only in the old state fade out,
 * terms only in the new state fade in. Positions are SVG attributes, so the DOM is identical for the same t.
 */
(function () {
'use strict';
const D = window.Diki;

function mount(container, fixture, opts) {
  const T = D.T, W = container.clientWidth, H = container.clientHeight;
  const svg = D.svg('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, class: 'eq-svg' }, container);
  svg.style.overflow = 'visible';
  const els = {}, widths = {};                                  // widths at font-size 100
  for (const id in opts.terms) {
    const def = opts.terms[id];
    const tx = D.svg('text', { id: 'eq_' + id, x: 0, y: 0, 'font-size': 100, 'font-weight': T.type.equation.weight, fill: D.color(def.role || 'ink'), opacity: 0 }, svg);
    tx.style.fontFamily = 'var(--font-math)';
    if (def.italic) tx.setAttribute('font-style', 'italic');
    def.parts.forEach((pt, i) => { if (i) tx.appendChild(document.createTextNode('\u00A0')); D.text(D.svg('tspan', {}, tx), pt.fx, pt.dec); });   // NBSP between parts: chrome, not science
    els[id] = tx; widths[id] = tx.getComputedTextLength();
  }
  const wOf = (id, size) => widths[id] * size / 100;
  const layouts = {};
  for (const name in opts.states) {
    const st = opts.states[name], pos = {};
    if (st.layout === 'grid') {
      const size = st.size || T.type.compare.size, gap = 0.28 * size, col = 0.55 * size, pitch = size * 1.22;
      const gw = ids => ids.reduce((s, id) => s + wOf(id, size), 0) + Math.max(0, ids.length - 1) * gap;
      const Lw = Math.max(...st.rows.map(r => gw(r.l || []))), Mw = Math.max(...st.rows.map(r => gw(r.m || []))), Rw = Math.max(...st.rows.map(r => gw(r.r || [])));
      const total = Lw + col + Mw + col + Rw, x0 = (W - total) / 2;
      if (total > W + 1) D._warn('W_EQ_OVERFLOW', 'equation state ' + name + ' is ' + Math.round(total) + ' px > lane ' + W);
      const top = (H - st.rows.length * pitch) / 2;
      st.rows.forEach((r, ri) => {
        const y = top + ri * pitch + 0.82 * size;
        const place = (ids, x) => ids.forEach(id => { pos[id] = { x, y, size }; x += wOf(id, size) + gap; });
        place(r.l || [], x0 + Lw - gw(r.l || []));                      // left column right-aligned
        place(r.m || [], x0 + Lw + col + (Mw - gw(r.m || [])) / 2);   // marks centred
        place(r.r || [], x0 + Lw + col + Mw + col);                   // right column left-aligned
      });
    } else {
      const size = st.size || T.type.equation.size, gap = 0.3 * size;
      const total = st.terms.reduce((s, id) => s + wOf(id, size), 0) + (st.terms.length - 1) * gap;
      if (total > W + 1) D._warn('W_EQ_OVERFLOW', 'equation state ' + name + ' is ' + Math.round(total) + ' px > lane ' + W);
      let x = (W - total) / 2; const y = H / 2 + 0.36 * size;
      st.terms.forEach(id => { pos[id] = { x, y, size }; x += wOf(id, size) + gap; });
    }
    for (const id in pos) if (!els[id]) throw new Error('equation state ' + name + ' uses unknown term ' + id);
    layouts[name] = pos;
  }
  const roleIn = (name, id) => (opts.states[name] && opts.states[name].roles && opts.states[name].roles[id]) || opts.terms[id].role || 'ink';

  /* pure: paints the blend between two named states at progress p (0..1) */
  function set({ from, to, p }) {
    const A = from ? layouts[from] : null, B = to ? layouts[to] : null;
    for (const id in els) {
      const a = A && A[id], b = B && B[id], el = els[id];
      let q, o;
      if (a && b) { q = { x: D.lerp(a.x, b.x, p), y: D.lerp(a.y, b.y, p), size: D.lerp(a.size, b.size, p) }; o = 1; }
      else if (a) { q = a; o = 1 - D.clamp01(p / 0.4); }            // leaving terms are gone by 40 %
      else if (b) { q = b; o = D.clamp01((p - 0.4) / 0.6); }        // arriving terms start at 40 %: no pile-up mid-transform
      else { q = { x: 0, y: 0, size: 100 }; o = 0; }                 // canonical when absent: same DOM for the same t
      el.setAttribute('x', q.x.toFixed(2)); el.setAttribute('y', q.y.toFixed(2)); el.setAttribute('font-size', q.size.toFixed(2));
      el.setAttribute('opacity', (o < 1e-4 ? 0 : o).toFixed(4));
      el.setAttribute('fill', D.color(a || b ? roleIn(p < 0.5 && from ? from : to || from, id) : opts.terms[id].role || 'ink'));
    }
  }

  /* registers ONE track for this equation from verb steps (D.CompareStates / D.EquationTransform / D.RevealMismatch) */
  function drive(steps, o = {}) {
    const S = steps.map(s => ({ ...s, dur: D._stepDur(s) })).sort((a, b) => a.at - b.at);
    S.forEach(s => {
      if (!layouts[s.state]) throw new Error('unknown equation state ' + s.state);
      if (s.verb === 'CompareStates' && opts.states[s.state].layout !== 'grid') D._warn('W_VERB_MISUSE', 'CompareStates to non-grid state ' + s.state);
      if (s.verb === 'RevealMismatch') {
        const mis = Object.keys(layouts[s.state]).filter(id => roleIn(s.state, id) === 'mismatch');
        if (!mis.length) D._warn('W_VERB_MISUSE', 'RevealMismatch state ' + s.state + ' has no mismatch term');
        if (s.emphasize !== false) mis.forEach(id => D.Emphasize(els[id], s.at + s.dur));
      }
    });
    D.track(t => {
      let prev = o.initial || null, cur = null;
      for (const s of S) { if (t < s.at - D.EPS) break; prev = cur ? cur.state : prev; cur = s; }
      if (!cur) set({ from: null, to: o.initial || null, p: 1 });
      else set({ from: prev, to: cur.state, p: D.prog(t, cur.at, cur.dur, 'standard') });
    });
  }
  return { svg, el: id => els[id], set, drive, layouts };
}

D.Components.equation = { mount };
})();
</script>
<script>/* inlined caption.js */
/* components/caption.js - burnt-in caption lane as a paper chip (design system v2.0.0). Used ONLY in the
 * 'captioned' layout (A2: the caption lane exists only when captions are burnt in).
 *
 * mount(container, fixture, opts) -> { set({ t }), chunks }
 *   container: the caption lane div; opts.sheet: the cue sheet (words[] timing + meta.beats_text verbatim text)
 * Text is the approved beat text with punctuation (beats_text), split into chunks of <= type.caption.max_words
 * words, breaking after . ? ! ; and after a comma once a chunk has 3 words. A chunk shows from its first word
 * (minus the reveal lead) until the next chunk, the beat end + 0.4 s, or a think window. Opacity only.
 * Outro beats (outro.brand / outro.disclosure) are never captioned: the end card carries the brand (PD-20).
 */
(function () {
'use strict';
const D = window.Diki;

function mount(container, fixture, opts) {
  const T = D.T, S = opts.sheet, beats = (S.meta && S.meta.beats_text) || [], think = (S.meta && S.meta.think_windows) || [];
  const chunks = [];
  beats.forEach(b => {
    if (T.brand.endcard_slots.includes(b.slot) || !b.word_range) return;
    const toks = b.text.split(/\s+/).filter(x => /[\p{L}\p{N}]/u.test(x));
    let [i] = b.word_range, cur = [];
    const flush = () => { if (cur.length) chunks.push({ toks: cur.map(c => c.tok), t0: S.words[cur[0].i].t0, end: b.end + 0.4 }); cur = []; };
    toks.forEach(tok => {
      cur.push({ tok, i }); i++;
      if (/[.?!;:]$/.test(tok) || cur.length >= T.type.caption.max_words || (/,$/.test(tok) && cur.length >= 3)) flush();
    });
    flush();
  });
  chunks.forEach((c, n) => {
    const nx = chunks[n + 1]; if (nx && nx.t0 - T.motion.lead < c.end) c.end = nx.t0 - T.motion.lead;
    think.forEach(w => { if (w.start >= c.t0 && w.start < c.end) c.end = w.start; });
    const el = D.div('caption', container); el.lang = S.language;
    D.div('', el, 'span').textContent = c.toks.join(' ');
    c.el = el;
    if (el.firstChild.offsetHeight > container.clientHeight + 1) D._warn('W_CAPTION_OVERFLOW', 'caption chunk "' + el.textContent + '" exceeds the caption lane');
  });
  const lead = T.motion.lead, dur = T.motion.verbs.Reveal.dur;
  function set({ t }) {
    chunks.forEach(c => {
      const a = Math.max(0, c.t0 - lead), o = D.prog(t, a, dur, 'out') * (1 - D.prog(t, c.end - dur * 0.75, dur * 0.75, 'out'));
      c.el.style.opacity = D.op(o);
    });
  }
  return { set, chunks };
}

D.Components.caption = { mount };
})();
</script>
<script>/* inlined card.js */
/* components/card.js - structured elements on the card sheet (design system v2.0.0, PD-18).
 * ONE card lane (layout 'carded') = a taped paper sheet; one card visible at a time (D.Card windows). Kinds:
 *   definition: { term: fxPath, text: fxPath, at?, role? }               a term (on a chip) and its one-line meaning
 *   points:     [{ fx, at?, role? }]                                     numbered points, each on its word
 *   table:      { head: [fxPath...], rows: [{ cells: [fxPath | {fx, dec?, role?, at?}], at? }] }   a small data table;
 *               a cell with `at` appears WHOLE on that reference (verb Card on the cell) inside a ruled empty slot,
 *               e.g. V and I from frame 0 and the V ÷ I cell only at the ratio beat
 * mount(container, fixture, opts) -> { el, rows: [{el, at}], set({opacity}) }
 *   opts: { id, kind, definition | points | table }   (opts.border is accepted for v1 scenes and ignored: the sheet
 *   is the frame)
 * Every string is a fixture value (data-fx, PD-13). A row with `at` appears whole on that reference (verb Card);
 * rows without `at` appear with the card. Taller than the lane: W_CARD_OVERFLOW; more than type.card.max_rows rows:
 * W_CARD_ROWS. Opacity only; nothing moves. The sheet (D.backdrop('card')) shows only while some card is visible.
 */
(function () {
'use strict';
const D = window.Diki;

const lanes = new Map();                       // container -> its cards

function mount(container, fixture, opts) {
  const T = D.T, K = opts.kind || 'definition';
  if (!lanes.has(container)) {
    lanes.set(container, []);
    const sheet = D.backdrop('card');
    D.track(t => { let m = 0; for (const c of lanes.get(container)) m = Math.max(m, parseFloat(c.style.opacity) || 0); if (sheet) sheet.style.opacity = D.op(m); }, 2);
  }
  const el = D.div('card card-' + K, container); if (opts.id) el.id = opts.id;   // .card-table: ruled row slots, so a table filling up is never an empty box
  lanes.get(container).push(el);
  const rows = [];
  const cell = (parent, spec, cls, cellAt) => {          // cellAt: only TABLE cells may carry their own `at`
    const s0 = typeof spec === 'string' ? { fx: spec } : spec, s = cellAt ? s0 : Object.assign({}, s0, { at: null });
    const c = D.div(cls || 'card-cell', s.at != null ? null : parent, 'span');
    if (s.role) c.style.color = D.color(s.role);
    D.text(c, s.fx, s.dec);
    if (s.at != null) {                                       // cell-level reveal: a ruled empty slot until its reference
      const slot = D.div('card-slot', parent, 'span'); slot.appendChild(c); D.Card(c, s.at); return c;
    }
    return c;
  };
  const row = (at, cls) => { const r = D.div('card-row ' + cls, el); rows.push({ el: r, at: at == null ? null : at }); return r; };
  if (K === 'definition') {
    const d = opts.definition, r = row(d.at, 'card-def');
    const term = D.chip(r, { fx: d.term, role: d.role || 'result', kind: 'lbl', rot: -2 }); term.classList.add('card-term');
    D.div('', r); cell(r, { fx: d.text }, 'card-text');
  } else if (K === 'points') opts.points.forEach((p, i) => { const r = row(p.at, 'card-point'); D.div('card-num', r, 'span').textContent = String(i + 1); cell(r, p, 'card-text'); });
  else if (K === 'table') { const tb = opts.table; if (tb.head) { const h = row(null, 'card-head'); tb.head.forEach(x => cell(h, x)); } tb.rows.forEach(rw => { const r = row(rw.at, 'card-tr'); rw.cells.forEach(x => cell(r, x, null, true)); }); }
  else throw D.fail('E_READY', 'card kind ' + K);
  rows.forEach(r => { if (r.at == null) r.el.style.opacity = 1; else D.Card(r.el, r.at); });
  if (rows.length > T.type.card.max_rows) D._warn('W_CARD_ROWS', 'card ' + (opts.id || K) + ' has ' + rows.length + ' rows > ' + T.type.card.max_rows);
  if (el.scrollHeight > container.clientHeight - 28 + 1) D._warn('W_CARD_OVERFLOW', 'card ' + (opts.id || K) + ' exceeds the card lane');
  const set = s => { if (s.opacity != null) el.style.opacity = s.opacity; };
  return { el, rows, set };
}

D.Components.card = { mount };
})();
</script>
<script>/* inlined physics_circuit.js */
/* components/physics_circuit.js - persistent series loop as cut-out STICKERS on the workbench (v2.0.0):
 * battery, resistor <-> filament lamp, ammeter; ink wires; every label on a chip.
 *
 * mount(container, fixture, opts) -> { svg, hero, el: {...}, set(state) }
 *   container: the diagram lane div (any size; the loop fills the lane height, text never scales)
 *   opts.fx: override any fixture path below (defaults match the Ohm example fixture)
 * set(state), all keys optional after the first call (StateTable passes the full state every frame):
 *   v, i       number (tweened by StateTable) or null -> shows display.ui.unknown ("?"), decimals from the fixture
 *   load       0 = resistor, 1 = filament lamp, between = cross-fade IN PLACE (SwapPart; the wires never move)
 *   heat       0..1 heat rays around the lamp + the glass glows (heat changes the condition)
 *   badge      0..1 condition chip opacity;  badgeDim 0..1 condition no longer holds (pair with StrikeThrough)
 *   fx         { v: path, i: path } fixture path of the value at rest, written to data-fx for the text diff
 * Layout (lane-relative; fits the 584 px 'carded' lane and the 864 px default lane), three rows inside the loop that
 * never touch: label chip above the top wire | condition chip under the load | I chip beside the ammeter; the V chip
 * sits left of the battery above the bottom wire. Colour by meaning: battery + V chip royal (voltage), ammeter + I chip
 * teal (current), resistor / lamp + R and condition chips mustard (resistance / condition). Labels >= 52 px.
 */
(function () {
'use strict';
const D = window.Diki;
const DEF = {
  r_label: 'display.r_label', r_value: 'parameters.resistance_ohm', r_unit: 'display.r_unit',
  v_label: 'display.v_label', v_unit: 'display.v_unit', i_label: 'display.i_label', i_unit: 'display.i_unit',
  ammeter: 'display.ammeter_symbol', condition: 'display.condition', lamp_label: 'display.lamp_label',
  unknown: 'display.ui.unknown', dec_v: 'display.decimals.v', dec_i: 'display.decimals.i'
};

function mount(container, fixture, opts = {}) {
  const T = D.T, P = Object.assign({}, DEF, opts.fx || {}), H = T.color.hue;
  const W = container.clientWidth, Hh = container.clientHeight;
  const svg = D.svg('svg', { width: W, height: Hh, viewBox: `0 0 ${W} ${Hh}` }, container);
  svg.style.overflow = 'visible'; svg.style.position = 'absolute'; svg.style.left = '0'; svg.style.top = '0';
  const g = D.svg('g', { id: opts.id || 'circuit' }, svg);

  // geometry: label row | top wire + load | condition row | ammeter + I row | V row | bottom wire + battery
  const xc = W / 2, xL = 40, xR = W - 40, aR = 56, half = 150;
  const yLabel = 46, yTop = 166, yBadge = yTop + 110, yBot = Hh - 66;
  const yA = Math.max(yBadge + 94, Math.round((yBadge + yBot) / 2) - 10), yV = yBot - 76;
  const wire = { fill: 'none', stroke: D.color('line.ink'), 'stroke-width': T.stroke.wire, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };

  // ink wires: one closed loop with gaps only where a part sits. Never redrawn.
  D.svg('path', Object.assign({ d: `M${xc - half},${yTop} L${xL},${yTop} L${xL},${yBot} L${xc - 78},${yBot} M${xc + 86},${yBot} L${xR},${yBot} L${xR},${yTop} L${xc + half},${yTop}` }, wire), g);
  // the load slot keeps its leads in both states (the loop is closed in every state)
  D.svg('path', Object.assign({}, wire, { d: `M${xc - half},${yTop} L${xc - 112},${yTop} M${xc + 112},${yTop} L${xc + half},${yTop}` }), g);

  // battery sticker on the bottom wire: royal body, navy end, cream + and - marks (shapes, not text), terminal nub
  const cell = D.sticker(g, { id: 'cell' });
  D.svg('rect', { x: xc - 78, y: yBot - 36, width: 150, height: 72, rx: 14, fill: H.royal }, cell);
  D.svg('rect', { x: xc - 78, y: yBot - 36, width: 40, height: 72, rx: 14, fill: H.navy }, cell);
  D.svg('rect', { x: xc + 72, y: yBot - 14, width: 14, height: 28, rx: 4, fill: H.ink }, cell);
  D.svg('path', { d: `M${xc + 40},${yBot - 14} v28 M${xc + 26},${yBot} h28 M${xc - 68},${yBot} h20`, stroke: H.paper, 'stroke-width': 6, 'stroke-linecap': 'round' }, cell);

  // load 1: resistor sticker (mustard capsule, colour bands, ink leads)
  const res = D.sticker(g, { id: 'resistor' });
  D.svg('path', { d: `M${xc - 112},${yTop} L${xc - 96},${yTop} M${xc + 96},${yTop} L${xc + 112},${yTop}`, stroke: H.ink, 'stroke-width': T.stroke.wire, 'stroke-linecap': 'round' }, res);
  D.svg('rect', { x: xc - 100, y: yTop - 34, width: 200, height: 68, rx: 30, fill: H.mustard }, res);
  [[-52, H.soil_dark], [-22, H.black], [8, H.black], [52, H.leaf_light]].forEach(([dx, c]) => D.svg('rect', { x: xc + dx - 8, y: yTop - 34, width: 16, height: 68, fill: c }, res));
  D.svg('path', { d: `M${xc - 80},${yTop - 18} C${xc - 40},${yTop - 26} ${xc + 30},${yTop - 26} ${xc + 76},${yTop - 18}`, stroke: H.paper, 'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none', opacity: 0.55 }, res);

  // load 2: filament lamp sticker in the same slot: glass bulb on the wire, ink filament, screw cap; glow + rays = heat
  const lamp = D.svg('g', { id: 'lamp' }, g);
  const glow = D.svg('circle', { cx: xc, cy: yTop, r: 92, fill: T.color.highlight, opacity: 0 }, lamp);
  const lampS = D.sticker(lamp, {});
  D.svg('path', { d: `M${xc - 112},${yTop} L${xc - 62},${yTop} M${xc + 62},${yTop} L${xc + 112},${yTop}`, stroke: H.ink, 'stroke-width': T.stroke.wire, 'stroke-linecap': 'round' }, lampS);
  const glass = D.svg('circle', { cx: xc, cy: yTop, r: 60, fill: H.paper, stroke: H.mustard, 'stroke-width': 10 }, lampS);
  D.svg('path', { d: `M${xc - 44},${yTop} L${xc - 26},${yTop} L${xc - 16},${yTop - 16} L${xc - 4},${yTop + 14} L${xc + 8},${yTop - 16} L${xc + 18},${yTop + 14} L${xc + 26},${yTop} L${xc + 44},${yTop}`, stroke: H.ink, 'stroke-width': 6, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, lampS);
  const heat = D.sticker(g, { id: 'heat' }, 'sm');
  [[-0.5, -0.866], [0.5, -0.866], [-0.9, -0.42], [0.9, -0.42]].forEach(([dx, dy], k) =>
    D.svg('line', { x1: xc + dx * 74, y1: yTop + dy * 74, x2: xc + dx * 90, y2: yTop + dy * 90, stroke: k < 2 ? H.brick : H.mustard, 'stroke-width': 9, 'stroke-linecap': 'round' }, heat));

  // ammeter sticker on the right wire: teal ring, cream face hides the wire, the A symbol from the fixture
  const amm = D.sticker(g, { id: 'ammeter' });
  D.svg('circle', { cx: xR, cy: yA, r: aR, fill: H.outline, stroke: H.teal, 'stroke-width': 12 }, amm);
  const aTxt = D.svg('text', { x: xR, y: yA + 20, 'text-anchor': 'middle', 'font-size': 56, 'font-weight': 800, fill: D.color('current') }, amm);
  aTxt.style.fontFamily = 'var(--font-sans)'; D.text(aTxt, P.ammeter);

  // labels on chips (HTML over the SVG, same px), colour by meaning
  const host = container;
  const chipOf = (id, role, parts, kind) => {
    const c = D.chip(null, { role, kind: kind || 'lbl', id, rot: 0 }); const spans = [];
    parts.forEach((p, n) => { if (n) c.appendChild(document.createTextNode(' ')); const s = D.div('', c, 'span'); if (p) D.text(s, p); spans.push(s); });
    return { c, spans };
  };
  const R = chipOf('r_label', 'resistance', [P.r_label, P.r_value, P.r_unit]); D.place(R.c, host, xc, yLabel, 'middle'); R.c.dataset.rot = '-2';
  const LL = chipOf('lamp_label', 'resistance', [P.lamp_label]); D.place(LL.c, host, xc, yLabel, 'middle'); LL.c.dataset.rot = '-2';
  const V = chipOf('v_label', 'voltage', [P.v_label, null, P.v_unit], 'readout'); D.place(V.c, host, xc - 100, yV, 'end'); V.c.dataset.rot = '1.5';
  const I = chipOf('i_readout', 'current', [P.i_label, null, P.i_unit], 'readout'); D.place(I.c, host, xR - aR - 22, yA, 'end'); I.c.dataset.rot = '-1.5';
  [R, LL, V, I].forEach(x => { x.c.style.transform = 'rotate(' + x.c.dataset.rot + 'deg)'; });

  const badge = D.Components.badge.mount(svg, fixture, { id: 'cond_badge', fx: P.condition, style: 'condition', x: xc, y: yBadge });

  const decV = D.dec(P.dec_v), decI = D.dec(P.dec_i), unknown = D.fx(P.unknown);
  const op = D.op;
  const val = (span, v, dec, path) => {
    if (v == null) { span.textContent = unknown; span.setAttribute('data-fx', P.unknown); span.removeAttribute('data-fx-dec'); return; }
    span.textContent = D.fmt(v, dec);
    if (path) span.setAttribute('data-fx', path);
    span.setAttribute('data-fx-dec', String(dec));
  };
  function set(s) {
    const fx = s.fx || {};
    val(V.spans[1], s.v, decV, fx.v); val(I.spans[1], s.i, decI, fx.i);
    const load = s.load || 0, h = s.heat || 0;
    res.style.opacity = op(1 - load); R.c.style.opacity = op(1 - load);
    lamp.style.opacity = op(load); LL.c.style.opacity = op(load);
    heat.style.opacity = op(h * load); glow.setAttribute('opacity', (0.85 * h * load).toFixed(4));
    glass.setAttribute('fill', h * load > 0.5 ? T.color.highlight : H.paper);
    badge.set({ opacity: s.badge == null ? 0 : s.badge, dim: s.badgeDim || 0 });
  }
  set({ v: null, i: null, load: 0, heat: 0, badge: 0 });
  return { svg, hero: g, set, el: { circuit: g, cell, resistor: res, lamp, heat, ammeter: amm, r_label: R.c, lamp_label: LL.c, v_label: V.c, v_value: V.spans[1], i_readout: I.c, i_value: I.spans[1], badge: badge.el } };
}

D.Components.physicsCircuit = { mount };
})();
</script>
<script>/* inlined chemistry_species.js */
/* components/chemistry_species.js - reaction formula + atom group + atom ledger from ONE state (v2.0.0, collage:
 * the formula and the ledger sit on taped paper sheets, every atom is a cut-out sticker with a cream outline).
 *
 * mount(container, fixture, opts) -> { svg, hero, el: { formula, coef: {id: el}, atoms: {id: el}, ledger }, set(state) }
 *   fixture[opts.reaction || 'reaction'] = {
 *     species: [ { id: 'h2', side: 'L'|'R', formula: [ ['H', 2] ] }, ... ],   // element symbol, subscript
 *     stages:  { unbalanced: { h2: 1, o2: 1, h2o: 1 }, balanced: { h2: 2, ... } },  // coefficients
 *     counts?: { balanced: { L: { H: 4, O: 2 }, R: { H: 4, O: 2 } } } }              // optional cross-check
 *   fixture.display: elements { H: 'H', ... }, plus '+', arrow '→', marks { eq: '=', ne: '≠' }
 * set(state): coef_<speciesId> number (StateTable tweens it; molecules fade in/out one by one and the column
 *   re-centres, so EXISTING atoms keep their identity and slide), atoms 0..1, ledger 0..1, fx { coef_<id>: path }.
 * Invariants: true subscripts (tspan at type.subscript.scale, >= 40 px), coefficients full size; coefficient 1
 * is not drawn; the ledger counts are DERIVED from the same coefficients as the atoms (never typed) and are
 * checked against fixture counts at mount (E_FIXTURE_MISMATCH); '≠' is the only red glyph.
 */
(function () {
'use strict';
const D = window.Diki;

function mount(container, fixture, opts = {}) {
  const T = D.T, RX = opts.reaction || 'reaction', R = D.fx(RX), C = r => D.color(r);
  const W = container.clientWidth, H = container.clientHeight;
  const sheets = D.div('', container); sheets.style.cssText = 'position:absolute;inset:0';   // paper sheets behind the SVG
  const svg = D.svg('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, container);
  svg.style.overflow = 'visible'; svg.style.position = 'absolute'; svg.style.left = '0'; svg.style.top = '0';
  const g = D.svg('g', { id: opts.id || 'reaction' }, svg);
  const EQ = T.type.equation.size;
  const text = (attrs, parent) => { const e = D.svg('text', Object.assign({ 'font-weight': T.type.equation.weight, fill: C('ink') }, attrs), parent || g); e.style.fontFamily = 'var(--font-math)'; return e; };
  const elFill = el => (T.color.chem[el] || { fill: '#FFFFFF', stroke: T.color.ink, text: T.color.ink });

  // --- counts derived from coefficients x subscripts; cross-check the fixture
  const sp = R.species;
  const countsFor = coefs => { const c = { L: {}, R: {} }; sp.forEach(s => s.formula.forEach(([e, n]) => { c[s.side][e] = (c[s.side][e] || 0) + n * coefs[s.id]; })); return c; };
  for (const stage in (R.counts || {})) {
    const got = countsFor(R.stages[stage]);
    for (const side of ['L', 'R']) for (const e in R.counts[stage][side]) if (got[side][e] !== R.counts[stage][side][e])
      throw D.fail('E_FIXTURE_MISMATCH', stage + ' ' + side + ' ' + e + ' derived ' + got[side][e] + ' != fixture ' + R.counts[stage][side][e]);
  }
  const elements = []; sp.forEach(s => s.formula.forEach(([e]) => { if (!elements.includes(e)) elements.push(e); }));
  const maxCoef = {}; sp.forEach(s => { maxCoef[s.id] = Math.max(...Object.values(R.stages).map(st => st[s.id])); });

  // --- formula row: [coef slot][species]  +  ...  →  ...   (one text per species; true subscripts)
  const formula = D.svg('g', { id: 'formula' }, g), yF = EQ * 1.15;
  const probe = text({ 'font-size': EQ }, formula); probe.textContent = '8'; const slot = probe.getComputedTextLength() + 6; probe.remove();
  const coefEl = {}, items = [];
  sp.forEach((s, si) => {
    if (si && sp[si - 1].side === s.side) items.push({ glyph: 'display.plus' });
    if (si && sp[si - 1].side !== s.side) items.push({ glyph: 'display.arrow' });
    items.push({ species: s, si });
  });
  let x = 0; const gap = 0.32 * EQ;
  items.forEach(it => {
    if (it.glyph) { const e = D.text(text({ 'font-size': EQ, x, y: yF, fill: C('muted') }, formula), it.glyph); it.el = e; it.w = e.getComputedTextLength(); x += it.w + gap; return; }
    const s = it.species, ce = text({ id: 'coef_' + s.id, 'font-size': EQ, x: x + slot - 6, y: yF, 'text-anchor': 'end', fill: C('chem.coefficient') }, formula);
    coefEl[s.id] = ce; x += slot;
    const t = text({ id: 'formula_' + s.id, 'font-size': EQ, x, y: yF }, formula);
    D.formula(t, s.formula, RX + '.species.' + it.si + '.formula', EQ);
    it.el = t; x += t.getComputedTextLength() + gap;
  });
  const fw = x - gap, fx0 = (W - fw) / 2;
  if (fw > W + 1) D._warn('W_FORMULA_OVERFLOW', 'formula ' + Math.round(fw) + ' px > lane ' + W);
  formula.querySelectorAll('text').forEach(e => e.setAttribute('x', (parseFloat(e.getAttribute('x')) + fx0).toFixed(1)));
  D.sheetEl(sheets, { x: Math.round(Math.max(0, fx0 - 34)), y: 0, w: Math.round(Math.min(W, fw + 68)), h: Math.round(yF + 0.42 * EQ + 18) }, [['teal', 0.15], ['pink', 0.85]]);

  // --- atom group: one molecule per coefficient unit; atoms keep ids across coefficient changes
  const rowP = 86, ly0 = H - rowP * elements.length - 10;              // ledger rows sit at the bottom of the lane
  const ar = 46, step = ar * 1.55, pitch = ar * 2.5, cy = (yF + 40 + ly0) / 2;   // atom group centred between formula and ledger
  const atomsG = D.svg('g', { id: 'atoms' }, g), atomEl = {}, mols = [];
  ['L', 'R'].forEach(side => {
    const list = sp.filter(s => s.side === side), x0 = side === 'L' ? 0 : W / 2 + 50, x1 = side === 'L' ? W / 2 - 50 : W;
    list.forEach((s, ci) => {
      const colX = x0 + (x1 - x0) * (ci + 0.5) / list.length;
      const order = []; s.formula.forEach(([e, n]) => { for (let j = 0; j < n; j++) order.push(e); });
      if (order.length === 3) { const single = s.formula.find(([, n]) => n === 1); if (single) { const i = order.indexOf(single[0]); order.splice(i, 1); order.splice(1, 0, single[0]); } }
      for (let k = 0; k < maxCoef[s.id]; k++) {
        const mg = D.svg('g', { id: 'mol_' + s.id + '_' + k, filter: 'url(#cut-sm)' }, atomsG), atoms = [];
        order.forEach((e, j) => {
          const a = D.svg('g', { id: `atom_${s.id}_${k}_${e}${j}`, 'data-identity': `${s.id}#${k}:${e}${j}` }, mg), f = elFill(e);
          const c = D.svg('circle', { r: ar, fill: f.fill, stroke: f.stroke, 'stroke-width': T.stroke.detail }, a);
          const l = D.text(text({ 'text-anchor': 'middle', 'font-size': T.type.atom_letter.size, 'font-weight': T.type.atom_letter.weight, fill: f.text }, a), 'display.elements.' + e);
          atoms.push({ c, l, dx: (j - (order.length - 1) / 2) * step }); atomEl[a.id] = a;
        });
        mols.push({ s, k, g: mg, atoms, colX });
      }
    });
  });
  const arrowMid = D.text(text({ 'font-size': EQ, x: W / 2, y: cy + EQ * 0.36, 'text-anchor': 'middle', fill: C('muted') }), 'display.arrow');

  // --- ledger: element | left count | mark | right count (derived)
  const ledger = D.svg('g', { id: 'ledger' }, g), LB = T.type.label.size, rows = {};
  const ledgerSheet = D.sheetEl(sheets, { x: Math.round(W / 2 - 270), y: Math.round(ly0 - 14), w: 540, h: Math.round(rowP * elements.length + 20) }, [['mustard', 0.5]]);
  elements.forEach((e, n) => {
    const y = ly0 + n * rowP + rowP / 2, f = elFill(e);
    D.svg('rect', { x: W / 2 - 230, y: y - 36, width: 72, height: 72, rx: 14, fill: f.fill, filter: 'url(#cut-sm)' }, ledger);
    D.text(text({ x: W / 2 - 194, y: y + LB * 0.36, 'text-anchor': 'middle', 'font-size': LB, fill: f.text }, ledger), 'display.elements.' + e);
    const mk = (xx, anchor) => text({ x: xx, y: y + LB * 0.36, 'text-anchor': anchor, 'font-size': LB }, ledger);
    rows[e] = { L: mk(W / 2 - 40, 'end'), M: mk(W / 2 + 20, 'middle'), R: mk(W / 2 + 80, 'start') };
  });
  const marks = { eq: D.fx('display.marks.eq'), ne: D.fx('display.marks.ne') };

  const op = v => (v < 1e-4 ? 0 : v > 0.9999 ? 1 : v).toFixed(4);
  const shown = c => Math.ceil(c - 1e-9);                       // a coefficient mid-tween shows its target integer

    });

    elements.forEach(e => {
      const r = rows[e], l = cnt.L[e] || 0, rr = cnt.R[e] || 0, ok = l === rr;

  set(init);
  return { svg, hero: g, set, el: { formula, coef: coefEl, atoms: atomEl, ledger, arrow: arrowMid, rows } };
}

D.Components.chemistrySpecies = { mount };
})();

<script>/* inlined biology_tracer.js */
/* components/biology_tracer.js - compartments, material vs energy arrows, carbon tracer (design system v2.0.0,
 * the reference collage look: each compartment is a tinted taped paper sheet (sky, grass, paper...) with its name on a
 * chip, arrows are two-tone (cream outline under the stroke), the carbon token is the charcoal C sticker).
 *
 * mount(container, fixture, opts) -> { svg, hero, el: { compartments, stations, material: [paths], energy, token, scale }, set(state) }
 *   fixture[opts.tracer || 'tracer'] = {
 *     compartments: [ { id: 'air', label: 'display.bio.air' }, ... ]            // stacked top -> bottom
 *     stations: [ { id: 'co2', compartment: 'air', formula?: [['C',1],['O',2]], name?: 'display.bio.sugar' }, ... ]
 *     energy: { label: 'display.bio.light', into: 'leaf' },  scale_note: 'display.bio.scale_note' }
 * set(state): tracer 0..n-1 (station index; fractional = travelling along the material arrow), stations 0..n
 *   (station k visible when stations > k), material 0..1, energy 0..1, scale 0..1.
 * Invariants: material arrows are solid (bio.material), the energy arrow is a dashed wave (bio.energy) that ENDS
 * in its compartment (energy does not become wood); the tracer token is ONE object (one carbon) for the whole
 * scene; the scale disclosure badge says the picture is schematic. Formulae use true subscripts (D.formula).
 */
(function () {
'use strict';
const D = window.Diki;

function mount(container, fixture, opts = {}) {
  const T = D.T, PX = opts.tracer || 'tracer', TR = D.fx(PX), C = r => D.color(r);
  const W = container.clientWidth, H = container.clientHeight;
  const sheets = D.div('', container); sheets.style.cssText = 'position:absolute;inset:0';
  const svg = D.svg('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, container);
  svg.style.overflow = 'visible'; svg.style.position = 'absolute'; svg.style.left = '0'; svg.style.top = '0';
  const tints = T.color.bio.compartment_tints, OUT = T.sticker.outline_color;
  const two = (attrs, parent) => { D.svg('path', Object.assign({}, attrs, { stroke: OUT, 'stroke-width': attrs['stroke-width'] + 8, 'stroke-dasharray': 'none' }), parent); return D.svg('path', attrs, parent); };
  const g = D.svg('g', { id: opts.id || 'tracer' }, svg);
  const LB = T.type.label.size, EQ = T.type.equation.size;
  const text = (attrs, parent, math) => { const e = D.svg('text', Object.assign({ 'font-weight': T.type.label.weight, fill: C('ink') }, attrs), parent || g); e.style.fontFamily = math ? 'var(--font-math)' : 'var(--font-sans)'; return e; };

  // compartments stacked; the bottom strip keeps room for the scale badge
  const n = TR.compartments.length, gap = 20, top = 0, bottom = H - 104, ch = (bottom - top - gap * (n - 1)) / n;
  const comp = {};
  TR.compartments.forEach((c, i) => {
    const y = top + i * (ch + gap), cg = D.svg('g', { id: 'comp_' + c.id }, g);
    const sh = D.sheetEl(sheets, { x: 0, y: Math.round(y), w: W, h: Math.round(ch) }, [[['teal', 'pink', 'mustard'][i % 3], 0.62]]); sh.style.background = tints[i % tints.length];
    const lc = D.chip(null, { fx: c.label, role: 'label', kind: 'lbl', rot: -2 }); D.place(lc, container, 16, y + 44, 'start');
    comp[c.id] = { y, h: ch, g: cg };
  });

  // stations: text centred at sx, tracer anchor on the right-hand track at tx
  const sx = W * 0.62, tx = W - 92, anchors = [], stEl = [];
  TR.stations.forEach((s, i) => {
    const c = comp[s.compartment], sg = D.svg('g', { id: 'station_' + s.id }, g);
    let y = c.y + c.h / 2 + (s.formula && s.name ? -18 : 18);
    if (s.formula) { D.formula(text({ x: sx, y, 'text-anchor': 'middle', 'font-size': EQ, 'font-weight': T.type.equation.weight }, sg, true), s.formula, PX + '.stations.' + i + '.formula', EQ); y += LB + 18; }
    if (s.name) D.text(text({ x: sx, y, 'text-anchor': 'middle', 'font-size': LB, fill: C('ink') }, sg), s.name);
    anchors.push({ x: tx, y: c.y + c.h / 2 }); stEl.push(sg);
  });

  // material arrows between consecutive anchors (solid), arrowhead at the end
  const tokR = 40, mat = D.svg('g', { id: 'material' }, g), matPaths = [];
  for (let i = 0; i + 1 < anchors.length; i++) {
    const a = anchors[i], b = anchors[i + 1], y0 = a.y + tokR + 12, y1 = b.y - tokR - 14;
    matPaths.push(two({ d: `M${a.x},${y0} L${b.x},${y1}`, fill: 'none', stroke: C('bio.material'), 'stroke-width': T.stroke.arrow, 'stroke-linecap': 'round' }, mat));
    two({ d: `M${b.x - 18},${y1 - 22} L${b.x},${y1 + 2} L${b.x + 18},${y1 - 22}`, fill: 'none', stroke: C('bio.material'), 'stroke-width': T.stroke.arrow, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, mat);
  }

  // energy arrow: dashed wave from the top compartment into energy.into, ending there
  const top0 = comp[TR.compartments[0].id].y, en = D.svg('g', { id: 'energy' }, g), into = comp[TR.energy.into], ex = 200, ey0 = top0 + LB + 30, ey1 = into.y + into.h * 0.55;   // clear of the compartment labels (x < 140)
  let d = `M${ex},${ey0}`; for (let y = ey0 + 6; y <= ey1; y += 6) d += ` L${(ex + 14 * Math.sin((y - ey0) / 50 * 2 * Math.PI)).toFixed(1)},${y}`;
  two({ d, fill: 'none', stroke: C('bio.energy'), 'stroke-width': T.stroke.arrow, 'stroke-dasharray': '18 12', 'stroke-linecap': 'round' }, en);
  two({ d: `M${ex - 18},${ey1 - 18} L${ex},${ey1 + 6} L${ex + 18},${ey1 - 18}`, fill: 'none', stroke: C('bio.energy'), 'stroke-width': T.stroke.arrow, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, en);
  const enChip = D.chip(null, { fx: TR.energy.label, role: 'condition', kind: 'lbl', rot: 2 }); D.place(enChip, container, ex + 34, top0 + 44, 'start');   // energy label: mustard chip on the label row

  // the carbon tracer: one token for the whole scene
  const tok = D.svg('g', { id: 'carbon_token', 'data-identity': 'tracer#C', filter: 'url(#cut)' }, g), f = T.color.chem.C;
  const tc = D.svg('circle', { r: tokR, fill: f.fill }, tok);
  const tl = D.text(text({ 'text-anchor': 'middle', 'font-size': T.type.atom_letter.size, 'font-weight': T.type.atom_letter.weight, fill: f.text }, tok, true), 'display.elements.C');

  const scale = D.Components.badge.mount(g, fixture, { id: 'scale_badge', fx: TR.scale_note, style: 'scale', x: W / 2, y: H - 48 });

  const op = v => (v < 1e-4 ? 0 : v > 0.9999 ? 1 : v).toFixed(4);
  function set(s) {
    const k = Math.max(0, Math.min(anchors.length - 1, s.tracer || 0)), i = Math.min(anchors.length - 2, Math.floor(k)), u = k - i;
    const p = anchors.length > 1 ? { x: D.lerp(anchors[i].x, anchors[i + 1].x, u), y: D.lerp(anchors[i].y, anchors[i + 1].y, u) } : anchors[0];
    tc.setAttribute('cx', p.x.toFixed(2)); tc.setAttribute('cy', p.y.toFixed(2));
    tl.setAttribute('x', p.x.toFixed(2)); tl.setAttribute('y', (p.y + T.type.atom_letter.size * 0.36).toFixed(2));
    const st = s.stations == null ? anchors.length : s.stations;
    stEl.forEach((e, j) => { e.style.opacity = op(D.clamp01(st - j)); });
    mat.style.opacity = op(s.material == null ? 1 : s.material);
    en.style.opacity = op(s.energy == null ? 1 : s.energy); enChip.style.opacity = en.style.opacity;
    scale.set({ opacity: s.scale == null ? 1 : s.scale });
  }
  set({ tracer: 0 });
  return { svg, hero: g, set, el: { compartments: comp, stations: stEl, material: matPaths, energy: en, token: tok, scale: scale.el } };
}

D.Components.biologyTracer = { mount };
})();
</script>

  build(D) {
    // 1. the hero: one circuit of stickers, mounted once, preserved for the whole lesson (end card included)
    const C = D.Components.physicsCircuit.mount(D.lane('diagram').el, null, {});
    D.hero(C.hero); D.PreserveObject(C.hero, { name: 'circuit' });

    // 2. circuit states bound to cues (SwapPart = resistor <-> lamp in place; ChangeValue = readouts)
    D.StateTable(C, {
      initial: 'base',
      states: {
        base:    { v: 'fx:parameters.v1', i: 'fx:results.i1', load: 0, heat: 0, badge: 0, badgeDim: 0 },
        four:    { v: 'fx:parameters.v2', i: null },                 // the answer slot shows "?"
        four_i:  { i: 'fx:results.i2' },

      },
      steps: [
        { at: 'cue:c04', state: 'four',   verb: 'ChangeValue' },
        { at: 'cue:c06', state: 'four_i', verb: 'ChangeValue' },
        { at: 'cue:c11', state: 'cond',   verb: 'Badge' },
        { at: 'cue:c12', state: 'lamp',   verb: 'SwapPart' },
        { at: 'cue:c13', state: 'hot',    verb: 'SwapPart' },
        { at: 'cue:c14', state: 'broken', verb: 'StrikeThrough' },
        { at: 'cue:c15', state: 'lamp_i', verb: 'ChangeValue' },

    // 3. result sheet: before | x2 | after kept side by side, then the ratio, the name, the mismatch
    const sym = (s, role) => ({ parts: [{ fx: 'display.sym.' + s }], role, italic: true });
    const op = o => ({ parts: [{ fx: 'display.ops.' + o }], role: 'ink' });

        AB:    { layout: 'grid', rows: [{ l: ['V', 'eqV', 'v1'], r: ['V2', 'eqV2', 'v2'] }, { l: ['I', 'eqI', 'i1'], r: ['I2', 'eqI2', 'i2'] }] },
        ABm1:  { layout: 'grid', rows: [{ l: ['V', 'eqV', 'v1'], m: ['mv'], r: ['V2', 'eqV2', 'v2'] }, { l: ['I', 'eqI', 'i1'], r: ['I2', 'eqI2', 'i2'] }] },

    D.Card(Tb.el, null, { windows: [[0, 'cue:c10'], ['cue:c16', 'cue:c19']] });
    const Df = D.Components.card.mount(lane, null, { id: 'card_def', kind: 'definition', definition: { term: 'display.card.def.term', text: 'display.card.def.text' } });
    D.Card(Df.el, 'cue:c10', { until: 'cue:c16' });

      { fx: 'display.card.points.p1', at: 'cue:c19' }, { fx: 'display.card.points.p2', at: 'cue:c19+0.5' }, { fx: 'display.card.points.p3', at: 'cue:c19+1.0' }] });

<!-- [5] CONTRACT BLOCK - keep as is (seek contract 1.0.0: DURATION, async seek, ready, __errors, injected
     __CUE_SHEET__/__FIXTURE__ > ?cues=/?fixture= > inline, seeded PRNG only, fonts preloaded, offline). -->
<script>
(function () {
'use strict';
const Q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(Q.get(k)); return isFinite(v) ? v : d; };
const FPS = num('fps', 30), SEED = num('seed', 20261016);

window.__errors = [];
const report = (code, severity, message, t) => window.__errors.push({ code, severity, message, t: t == null ? null : t });
const fail = (code, message, t) => { report(code, 'error', message, t); const e = new Error(code + ': ' + message); e.code = code; return e; };

/* seeded randomness only (F04). rngAt is stateless: same (seed, i) -> same value in any seek order. */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rngAt = (seed, i) => mulberry32((seed ^ Math.imul(i + 1, 0x9E3779B1)) >>> 0)();

const deepFreeze = o => { Object.values(o).forEach(v => { if (v && typeof v === 'object') deepFreeze(v); }); return Object.freeze(o); };
async function loadJson(inject, param, inlineId, what) {
  if (inject) return { data: inject, source: 'injected' };
  const path = Q.get(param);
  if (path) {
    try { const r = await fetch(path); if (!r.ok) throw new Error('HTTP ' + r.status); return { data: await r.json(), source: 'path' }; }
    catch (e) {
      if (Q.get('strict') === '1') throw fail('E_' + what + '_LOAD', 'cannot load ' + path + ': ' + e.message);
      report('W_' + what + '_FALLBACK', 'warning', 'cannot load ' + path + ' (' + e.message + '); inline fallback used. Not valid for production.');
      return { data: JSON.parse(document.getElementById(inlineId).textContent), source: 'inline-fallback' };
    }
  }
  return { data: JSON.parse(document.getElementById(inlineId).textContent), source: 'inline' };
}
function checkSheet(s) {
  if (!s || !(s.duration > 0) || !isFinite(s.duration) || !Array.isArray(s.words) || !Array.isArray(s.cues)) throw fail('E_CUES_INVALID', 'cue sheet needs finite duration>0, words[], cues[]');
  s.words.forEach((w, i) => { if (i && w.t0 < s.words[i - 1].t0) throw fail('E_CUES_INVALID', 'words[' + i + '] not monotonic'); });
}

window.FPS = FPS;
window.DURATION = 7.2;                                  // synchronous default; final value comes from the cue sheet in ready()
window.SCENE_META = { contract: '1.0.0', videoCount: 0, designSystem: 'professor-diki-simplified 2.0.0', notes: 'paper collage; one scene per short; board persists' };
window.ready = (async () => {
  const D = window.Diki, T = window.DIKI_TOKENS;
  if (!D || !T) throw fail('E_READY', 'design system scripts (tokens.js, diki_runtime.js) not loaded');
  const s = await loadJson(window.__CUE_SHEET__, 'cues', 'cue-sheet-inline', 'CUES'); const SHEET = s.data; window.__cueSource = s.source; checkSheet(SHEET);
  const f = await loadJson(window.__FIXTURE__, 'fixture', 'fixture-inline', 'FIXTURE'); const FX = deepFreeze(f.data); window.__fixtureSource = f.source;
  window.DURATION = SHEET.duration;
  window.FRAME_COUNT = Math.round(window.DURATION * FPS);
  if (SHEET.fps !== FPS) report('W_FPS_MISMATCH', 'warning', 'cue sheet fps ' + SHEET.fps + ' != render fps ' + FPS + '; times stay in seconds');
  await Promise.all(T.font.preload.map(p => document.fonts.load(p.weight + ' 40px "' + p.family + '"', p.text).catch(e => report('E_FONT_LOAD', 'error', p.family + ': ' + e.message))));
  const SC = window.DIKI_SCENE || {}, stage = document.getElementById('stage');
  const captions = !!SC.captions || Q.get('captions') === '1';
  const layout = captions ? 'captioned' : (SC.card || Q.get('card') === '1') ? 'carded' : 'default';
  if (captions && SC.card) report('W_LAYOUT', 'warning', 'captions and a card cannot share a frame; captioned layout used');
  D.init({ sheet: SHEET, fx: FX, report, fail, stage, captions, layout, subject: SC.subject });
  D.rngAt = i => rngAt(SEED, i);                        // the only randomness a scene may use
  D.bindFx(stage);
  D.buildChrome();
  if (typeof SC.build === 'function') SC.build(D, FX);
  if (captions) { const cap = D.Components.caption.mount(document.getElementById('lane-caption'), FX, { sheet: SHEET }); D.track(t => cap.set({ t })); }
  // cues: every element_id must exist (W_CUE_NO_ELEMENT); 'emphasis' cues get Emphasize automatically,
  // every other kind is wired by the scene through D.when('cue:<id>').
  SHEET.cues.forEach(c => {
    const el = c.element_id && document.getElementById(c.element_id);
    if (!el) { if (c.kind !== 'hold') report('W_CUE_NO_ELEMENT', 'warning', 'cue ' + c.id + ' targets missing element ' + c.element_id); return; }
    if (c.kind === 'emphasis') D.Emphasize(el, c.at);
  });
  D.finalize();
  if (Q.get('safe') === '1') stage.classList.add('safe');
  await document.fonts.ready;
})().catch(e => { if (!e.code) report('E_READY', 'error', e.message); throw e; });

let chain = Promise.resolve();                          // serialise seeks
window.seek = async function seek(t) {
  const prev = chain; let done; chain = new Promise(r => { done = r; });
  try {
    await prev; await window.ready;
    if (typeof t !== 'number' || !isFinite(t)) throw fail('E_BAD_T', 'seek(t) needs a finite number of seconds, got ' + t);
    const tc = Math.min(Math.max(t, 0), window.DURATION);
    window.Diki.render(tc);
    await document.fonts.ready;                         // no rAF: the harness triggers the capture
    await Promise.all(Array.from(document.images).map(i => i.decode().catch(e => report('E_ASSET_LOAD', 'error', i.src + ': ' + e.message, tc))));
    return { t: tc, frame: Math.round(tc * FPS) };
  } finally { done(); }
};
window.__hf = window.__hf || { get duration() { return window.DURATION; }, seek: t => window.seek(t) };   // shape unverified [N68]

if (Q.get('preview') === '1') window.ready.then(() => { const r = document.createElement('input'); r.type = 'range'; r.id = 'scrub'; r.min = 0; r.max = window.DURATION; r.step = 1 / FPS; r.value = 0; r.oninput = () => window.seek(parseFloat(r.value)); document.body.appendChild(r); });
if (Q.has('t')) window.ready.then(() => window.seek(num('t', 0)));
})();
</script>
